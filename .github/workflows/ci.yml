name: CI

on:
  push:
    branches: [main]
    paths-ignore:          # ren dokumentation udløser hverken CI eller (dermed) deploy
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install
        run: npm ci

      - name: Typecheck (lint)
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build and test backend
        run: dotnet test server/Bridge.slnx -c Release
